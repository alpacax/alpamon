version: 2

project_name: alpamon

release:
  prerelease: auto

before:
  hooks:
    - go generate ./pkg/db/ent

builds:
  - id: alpamon-linux
    main: ./cmd/alpamon
    binary: alpamon
    ldflags:
      - -s -w -X github.com/alpacax/alpamon/v2/pkg/version.Version={{.Version}}
    flags:
      - -trimpath
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64

  - id: alpamon-darwin
    main: ./cmd/alpamon
    binary: alpamon
    ldflags:
      - -s -w -X github.com/alpacax/alpamon/v2/pkg/version.Version={{.Version}}
    flags:
      - -trimpath
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64

  - id: alpamon-windows
    main: ./cmd/alpamon
    binary: alpamon
    ldflags:
      - -s -w -X github.com/alpacax/alpamon/v2/pkg/version.Version={{.Version}}
    flags:
      - -trimpath
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64

checksum:
  name_template: '{{ .ProjectName }}-{{ trimprefix .Version "v" }}-checksums.sha256'

archives:
  - id: alpamon
    name_template: '{{ .ProjectName }}-{{ trimprefix .Version "v" }}-{{ .Os }}-{{ .Arch }}'
    # Default to tar.gz everywhere so the self-updater
    # (pkg/updater/updater.go) which hardcodes the .tar.gz suffix keeps
    # working. On Windows we additionally publish .zip so operators
    # doing a manual download get the format native to Windows.
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - tar.gz
          - zip

  # Stable-name alias for Windows. Produces an unversioned
  # `alpamon-windows-amd64.zip` in addition to the versioned archive in
  # the block above, so alpacon-server (and any external consumer) can
  # point at `releases/latest/download/alpamon-windows-amd64.zip`
  # without having to bump a version constant on every alpamon release.
  # The versioned archive remains the canonical one for the self-updater
  # (which resolves an exact tag) and for SHA-256 audit trails.
  - id: alpamon-windows-stable
    ids:
      - alpamon-windows
    name_template: '{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}'
    formats:
      - zip

nfpms:
  - builds:
      - alpamon-linux
    package_name: alpamon
    maintainer: AlpacaX <support@alpacax.com>
    description: |
      Open-source server agent for Alpacon, the AI-native PAM. Installed
      on each managed server, alpamon establishes an outbound-only
      connection to the Alpacon control plane (no inbound ports, no
      firewall changes) and enforces server-side decisions locally:
      terminal sessions, file transfers, remote command execution, and
      optional sudo verification via alpamon-pam. Every action runs
      inside a scoped work session and is recorded for audit.
    homepage: https://github.com/alpacax/alpamon
    license: MIT
    vendor: AlpacaX
    formats:
      - deb
      - rpm
    bindir: /usr/bin/

    contents:
      - src: "configs/tmpfile.conf"
        dst: "/usr/lib/tmpfiles.d/{{ .ProjectName }}.conf"

      - src: "configs/{{ .ProjectName }}.conf"
        dst: "/etc/alpamon/{{ .ProjectName }}.config.tmpl"

      - src: "configs/{{ .ProjectName }}.service"
        dst: "/lib/systemd/system/{{ .ProjectName }}.service"

      - src: "configs/{{ .ProjectName }}-restart.service"
        dst: "/lib/systemd/system/{{ .ProjectName }}-restart.service"

      - src: "configs/{{ .ProjectName }}-restart.timer"
        dst: "/lib/systemd/system/{{ .ProjectName }}-restart.timer"

    scripts:
      postinstall: "scripts/postinstall.sh"
      preremove: "scripts/preremove.sh"
      postremove: "scripts/postremove.sh"

    overrides:
      deb:
        dependencies:
          - zip
          - sqlite3
          - nftables | iptables
        file_name_template: '{{ .PackageName }}_{{ trimprefix .Version "v" }}_{{ .Os }}_{{ .Arch }}'
        recommends:
          - alpamon-pam
      rpm:
        dependencies:
          - zip
          - sqlite
          # rpm has no `|` alternation. nfpm parses `nftables | iptables` with
          # the same regex it uses for `name >= version`, so the requirement
          # became a hard `Requires: nftables` with `| iptables` stranded in the
          # (unused) version field: the alternative was dropped and hosts that
          # firewall with iptables were made to pull nftables in. rpm spells the
          # alternation as a boolean dependency, which needs rpm 4.13 or newer:
          # RHEL/Rocky/Alma/Oracle 8+, Fedora, Amazon Linux 2023 and SLES/Leap
          # 15+. The rpm 4.11 platforms (Amazon Linux 2, CentOS 7) cannot read
          # it, but they ship no nftables package either, so the requirement did
          # not resolve there before this change.
          - (nftables or iptables)
        file_name_template: '{{ .PackageName }}-{{ trimprefix .Version "v" }}-1.{{ .Os }}.{{ .Arch }}'
        recommends:
          - alpamon-pam
      
brews:
  - name: alpamon
    repository:
      owner: alpacax
      name: homebrew-alpacon
    commit_author:
      name: alpacaxbot
      email: support@alpacax.com
    directory: Formula
    homepage: "https://github.com/alpacax/alpamon"
    description: "Secure server agent for Alpacon"
    license: MIT
    skip_upload: auto

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"