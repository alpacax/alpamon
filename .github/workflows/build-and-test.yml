name: Build and Test
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"

  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

  workflow_call:

permissions:
  contents: read

jobs:
  verify-tidy:
    name: Verify go.mod and go.sum are tidy
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go and generate ent code
        uses: ./.github/actions/setup-go-generate

      - name: Verify go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  # pkg/wsclient is imported by alpacax/alpamon-kube, a separate module that
  # pins an alpamon tag, and its whole value is that it is a leaf: WebSocket
  # transport and nothing else. The day it imports pkg/config, pkg/utils,
  # internal/* or anything that drags in creack/pty or the systemd probes,
  # every importer has to compile the host agent just to open a socket, which
  # is how alpamon-dhcp-plugin ended up pinned to v1.3.0 for over a year. No
  # linter here enforces an import boundary (there is no .golangci.yml, so no
  # depguard), so this job is the only thing holding the line.
  #
  # It deliberately skips ./.github/actions/setup-go-generate. The ent package
  # is gitignored and loading pkg/wsclient must not need it; if this job ever
  # fails for want of generated code, the package has grown a dependency it
  # should not have, and red is the right answer.
  #
  # To run it yourself, save the step's script to a file and run it with
  # `PKG=... ALLOWED='...' bash that-file`. It needs nothing but Go. Do not
  # paste it into an interactive shell: `set -e` and `exit 1` would take the
  # shell down with it.
  leaf-guard:
    name: Verify pkg/wsclient stays a leaf
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # This job downloads almost nothing, and setup-go's cache key is the
          # same one the ubuntu jobs using setup-go-generate compute. Saving
          # from here would claim that key for a near-empty cache and leave the
          # jobs that need it with nothing to restore.
          cache: false

      - name: Check the dependency graph
        env:
          PKG: github.com/alpacax/alpamon/v2/pkg/wsclient
          # The only packages pkg/wsclient may reach outside the standard
          # library. pkg/tunnel and pkg/version are leaves themselves.
          ALLOWED: >-
            github.com/alpacax/alpamon/v2/pkg/wsclient
            github.com/alpacax/alpamon/v2/pkg/tunnel
            github.com/alpacax/alpamon/v2/pkg/version
            github.com/gorilla/websocket
        run: |
          set -euo pipefail

          # Plain string comparison rather than a regex. `if unexpected=$(grep
          # -vE "$ALLOWED" ...)` would read grep's exit 2, which is what a
          # mistyped pattern gives, the same as exit 1, and let the guard pass
          # on a package that had already drifted.
          allowed() {
            local candidate="$1" entry
            for entry in $ALLOWED; do
              if [ "$entry" = "$candidate" ]; then
                return 0
              fi
            done
            return 1
          }

          # go list resolves build constraints for one target at a time, so a
          # file tagged //go:build windows could import anything and a Linux
          # runner would never see it. Cover every target .goreleaser.yaml
          # ships, which build with CGO off, plus the cgo-on pass that matches
          # how this repo's own Linux jobs build.
          for target in linux/amd64/1 linux/amd64/0 linux/arm64/0 darwin/amd64/0 darwin/arm64/0 windows/amd64/0; do
            IFS=/ read -r goos goarch cgo <<<"$target"

            # {{if .Module}} prints only packages that come from a module,
            # which leaves out the standard library, including the
            # GOROOT-vendored vendor/golang.org/x/... packages crypto/tls and
            # net/http pull in. Those print as empty lines, which sed drops.
            # -deps skips test-only imports on purpose: tests may use testify,
            # and no importer compiles them, so do not add -test.
            deps="$(GOOS="$goos" GOARCH="$goarch" CGO_ENABLED="$cgo" \
              go list -deps -f '{{if .Module}}{{.ImportPath}}{{end}}' "$PKG" | sed '/^$/d')"

            # Unquoted on purpose: one dependency per word.
            # shellcheck disable=SC2086
            set -- $deps

            # A package that no longer resolves would leave nothing to check,
            # and every test below would pass on an empty list.
            self=no
            for dep in "$@"; do
              if [ "$dep" = "$PKG" ]; then
                self=yes
              fi
            done
            if [ "$self" = no ]; then
              echo "::error::$PKG is missing from its own dependency list on $target, so this guard would have passed without checking anything"
              printf '%s\n' "$deps"
              exit 1
            fi

            coupling=
            unexpected=
            for dep in "$@"; do
              case "$dep" in
                *pty*|*systemd*) coupling="$coupling  $dep"$'\n' ;;
              esac
              if ! allowed "$dep"; then
                unexpected="$unexpected  $dep"$'\n'
              fi
            done

            # Checked before the allowlist, which would refuse these too:
            # naming the two couplings that made a separate alpamon-kube
            # necessary says more than a generic message about whichever
            # transitive import happened to bring them in.
            if [ -n "$coupling" ]; then
              echo "::error file=pkg/wsclient/doc.go::on $target, pkg/wsclient's dependency graph reaches pty or systemd code:"
              printf '%s' "$coupling"
              exit 1
            fi
            if [ -n "$unexpected" ]; then
              echo "::error file=pkg/wsclient/doc.go::pkg/wsclient must stay a leaf, but on $target its dependency graph reaches:"
              printf '%s' "$unexpected"
              echo "Allowed: $ALLOWED, and the standard library."
              exit 1
            fi

            echo "pkg/wsclient on $target:"
            printf '%s\n' "$deps" | sed 's/^/  /'
          done

  # pkg/wsclient holds one connection open across reconnects with a read
  # loop, callers writing from their own goroutines, and a watcher that
  # interrupts a parked read. That ownership model is the whole point of the
  # package, and getting it wrong is what issue #452 is about in pkg/runner.
  # The suite below runs without the race detector on every platform, so a
  # race reintroduced here would pass it.
  #
  # Cheap enough to be worth its own job: no cgo of its own, no database and
  # no generated code, so it needs neither a distro container nor the ent
  # codegen step. `cache: false` for the same reason as leaf-guard, so this
  # job cannot claim the shared setup-go cache key for a near-empty cache.
  race-wsclient:
    name: Race detector (pkg/wsclient)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      # Twice over: a race that needs an unlucky interleaving does not always
      # show up on the first scheduling.
      - name: Run tests under the race detector
        run: go test -race -count=2 ./pkg/wsclient

  # Renamed from `build-and-test` so the flat aggregator at the bottom of this
  # file can take that id: a job id and the aggregate check name cannot be the
  # same string, and the aggregate is the one that has to be `build-and-test`.
  build-and-test-linux:
    name: Build and Test (${{ matrix.distro }})
    runs-on: ${{ matrix.runner }}
    # PATH is pinned because the runner rebuilds each exec PATH from the container config, and opensuse/leap:15 alone defines none.
    container:
      image: ${{ matrix.container }}
      env:
        PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    strategy:
      fail-fast: false
      matrix:
        include:
          # Debian/Ubuntu (amd64)
          - distro: ubuntu-20.04
            container: ubuntu:20.04
            pkg_manager: apt-get
            runner: ubuntu-latest
          - distro: ubuntu-22.04
            container: ubuntu:22.04
            pkg_manager: apt-get
            runner: ubuntu-latest
          - distro: ubuntu-24.04
            container: ubuntu:24.04
            pkg_manager: apt-get
            runner: ubuntu-latest
          - distro: debian-11
            container: debian:11
            pkg_manager: apt-get
            runner: ubuntu-latest
          - distro: debian-12
            container: debian:12
            pkg_manager: apt-get
            runner: ubuntu-latest
          # RHEL/CentOS yum-based (amd64)
          - distro: rocky-8
            container: rockylinux/rockylinux:8
            pkg_manager: yum
            runner: ubuntu-latest
          - distro: rhel-8
            container: redhat/ubi8
            pkg_manager: yum
            runner: ubuntu-latest
          # RHEL/CentOS dnf-based (amd64)
          - distro: rocky-9
            container: rockylinux/rockylinux:9
            pkg_manager: dnf
            runner: ubuntu-latest
          - distro: almalinux-9
            container: almalinux:9
            pkg_manager: dnf
            runner: ubuntu-latest
          - distro: rhel-9
            container: redhat/ubi9
            pkg_manager: dnf
            runner: ubuntu-latest
          # Fedora (amd64)
          - distro: fedora-41
            container: fedora:41
            pkg_manager: dnf
            runner: ubuntu-latest
          # Oracle Linux (amd64)
          - distro: oracle-9
            container: oraclelinux:9
            pkg_manager: dnf
            runner: ubuntu-latest
          # Amazon Linux (amd64)
          - distro: amazonlinux-2023
            container: amazonlinux:2023
            pkg_manager: dnf
            runner: ubuntu-latest
          # SUSE (amd64)
          - distro: opensuse-leap-15
            container: opensuse/leap:15
            pkg_manager: zypper
            runner: ubuntu-latest
          # ARM64
          - distro: ubuntu-24.04-arm64
            container: ubuntu:24.04
            pkg_manager: apt-get
            runner: ubuntu-24.04-arm
          - distro: rocky-9-arm64
            container: rockylinux/rockylinux:9
            pkg_manager: dnf
            runner: ubuntu-24.04-arm
          - distro: amazonlinux-2023-arm64
            container: amazonlinux:2023
            pkg_manager: dnf
            runner: ubuntu-24.04-arm

    steps:
      - name: Point bullseye-security at snapshot.debian.org (Debian 11 only)
        if: matrix.distro == 'debian-11'
        run: |
          # Debian 11 (bullseye) left LTS on 2026-08-31 and bullseye-security's CDN pool is being retired, but this image's libc6/perl-base are already security-updated and libc6-dev/perl need those exact versions, so the source cannot just be dropped. Point it at snapshot.debian.org instead, which still serves the full suite.
          sed -i 's|^deb .*bullseye-security.*|deb [check-valid-until=no] http://snapshot.debian.org/archive/debian-security/20260901T000000Z bullseye-security main|' /etc/apt/sources.list 2>/dev/null || true
          sed -i 's|^deb .*bullseye-security.*|deb [check-valid-until=no] http://snapshot.debian.org/archive/debian-security/20260901T000000Z bullseye-security main|' /etc/apt/sources.list.d/*.sources 2>/dev/null || true

      - name: Install dependencies (Debian/Ubuntu)
        if: matrix.pkg_manager == 'apt-get'
        run: |
          apt-get update -o Acquire::Retries=3
          apt-get install -y -o Acquire::Retries=3 --no-install-recommends git curl gcc libc6-dev ca-certificates

      - name: Install dependencies (yum)
        if: matrix.pkg_manager == 'yum'
        run: yum install -y git curl gcc glibc-devel tar

      - name: Install dependencies (dnf)
        if: matrix.pkg_manager == 'dnf'
        run: dnf install -y --allowerasing git curl gcc glibc-devel tar

      # gzip is explicit because the Leap base ships neither tar nor gzip, and setup-go extracts with `tar xz`.
      - name: Install dependencies (zypper)
        if: matrix.pkg_manager == 'zypper'
        run: zypper --non-interactive install git curl gcc glibc-devel tar gzip

      - name: Mark workspace as safe for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go and generate ent code
        uses: ./.github/actions/setup-go-generate

      - name: Build
        run: go build -v .
        working-directory: ./cmd/alpamon

      - name: Run Tests
        run: go test -v ./... -p 1

  build-and-test-windows:
    name: Build and Test (windows-amd64)
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go and generate ent code
        uses: ./.github/actions/setup-go-generate

      - name: Build
        run: go build -v .
        working-directory: ./cmd/alpamon

      # Parse install.ps1 under both Windows PowerShell 5.1 and
      # PowerShell 7.x to catch future syntax-compatibility drift.
      # This is a parse-only regression guard, not a behavior test:
      # the install.ps1 PS-7.x fix gates ServicePointManager assignments
      # on $PSVersionTable.PSEdition (only the Desktop edition takes the
      # legacy shim), which both shells parse cleanly. Actual fix
      # behavior is verified manually on hosts with degraded OS TLS
      # (see docs/windows.md > PowerShell compatibility).
      - name: Parse install.ps1 under Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $PWD 'scripts\install.ps1'
          if (-not (Test-Path $script)) { throw "install.ps1 not found at $script" }
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
              $script, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
              foreach ($e in $parseErrors) {
                  Write-Host "::error file=scripts/install.ps1,line=$($e.Extent.StartLineNumber)::$($e.Message)"
              }
              throw "install.ps1 has $($parseErrors.Count) parse error(s) under Windows PowerShell 5.1."
          }
          Write-Host "install.ps1 parsed cleanly under Windows PowerShell $($PSVersionTable.PSVersion)."

      - name: Parse install.ps1 under PowerShell 7.x
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $PWD 'scripts/install.ps1'
          if (-not (Test-Path $script)) { throw "install.ps1 not found at $script" }
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
              $script, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
              foreach ($e in $parseErrors) {
                  Write-Host "::error file=scripts/install.ps1,line=$($e.Extent.StartLineNumber)::$($e.Message)"
              }
              throw "install.ps1 has $($parseErrors.Count) parse error(s) under PowerShell 7.x."
          }
          Write-Host "install.ps1 parsed cleanly under PowerShell $($PSVersionTable.PSVersion)."

      - name: Vet
        run: go vet ./...

      # Run the full suite on Windows. Packages that are Unix-only by
      # construction (user/group handlers not registered on Windows,
      # Unix shell path contracts, Unix file-mode assertions) are gated
      # with //go:build !windows or per-test runtime.GOOS skips; no
      # silent blanket skip. See alpamon issue #284 acceptance criteria.
      - name: Run Tests
        run: go test -v ./... -p 1

      # `--version` should print the version and exit 0 regardless of
      # whether Alpamon is registered. Guards against regressions that
      # would stall startup (e.g., trying to read config, hitting SCM).
      - name: Smoke test (--version)
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'cmd\alpamon\alpamon.exe'
          if (-not (Test-Path $exe)) { throw "alpamon.exe not found at $exe" }
          $output = & $exe --version
          if ($LASTEXITCODE -ne 0) {
            throw "alpamon --version exited with code $LASTEXITCODE"
          }
          if ([string]::IsNullOrWhiteSpace($output)) {
            throw "alpamon --version produced empty output"
          }
          Write-Host "alpamon --version: $output"

  build-and-test-macos:
    name: Build and Test (macos-arm64)
    runs-on: macos-14
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go and generate ent code
        uses: ./.github/actions/setup-go-generate

      - name: Build
        run: go build -v .
        working-directory: ./cmd/alpamon

      - name: Run Tests
        run: go test -v ./... -p 1

  # The aggregate check. Every job above is matrixed or platform-specific, so
  # each reports under a name that carries its distro—nineteen strings that
  # change whenever the matrix does. A name that moves cannot be a required
  # status check: a ruleset naming one that stops reporting leaves the pull
  # request pending forever rather than red. This job is the one flat,
  # stable string the matrix can be gated on.
  #
  # No `name:`, so the context is the job id: `build-and-test`, matching the
  # other Go repositories.
  #
  # `if: always()` is load-bearing. Without it a failed leg SKIPS this job, and
  # a skipped check run counts as PASSING for a required status check—so the
  # gate would go green exactly when it has to go red. Running is not enough
  # either: a job that runs and does nothing reports success whatever its legs
  # did, hence the explicit check below.
  build-and-test:
    needs:
      - verify-tidy
      - leaf-guard
      - race-wsclient
      - build-and-test-linux
      - build-and-test-windows
      - build-and-test-macos
    if: always()
    runs-on: ubuntu-latest
    steps:
      # Anything other than `success` fails, so a cancelled or skipped leg is
      # a failure too. No job here is conditional, so a skip means something
      # went wrong upstream rather than a leg that correctly opted out.
      - name: Require every job to have succeeded
        # Through the environment rather than interpolated into the script:
        # the values are GitHub's own job results, but keeping `${{ }}` out of
        # `run:` is the habit that stops a future edit from pasting attacker
        # input into a shell.
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || exit 1
          done
