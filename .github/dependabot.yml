version: 2
updates:
  # SHA- and digest-pinned dependencies receive no upstream patch on their
  # own—the pin is exact, so a fix upstream reaches this repo only as a raised pin.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    # A release must age a week before it is proposed, so a hijacked tag or a
    # malicious publish has time to be caught upstream first.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(actions)"
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: "docker"
    directories:
      - "/Dockerfiles/*/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    # Each directory tests one distro release, and the golang builder follows
    # go.mod; allow only digest refreshes and patch tags.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: "chore(docker)"
    groups:
      images:
        patterns:
          - "*"
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      dependencies:
        patterns:
          - "*"
