[server]
url = {{.URL}}
id = {{.ID}}
key = {{.Key}}

[ssl]
verify = {{.Verify}}
ca_cert = {{.CACert}}

[logging]
debug = {{.Debug}}

[pool]
# Maximum number of concurrent workers in the global worker pool
# Default: 20
# max_workers = 20

# Size of the job queue for the global worker pool
# Default: 200
# queue_size = 200

# Default timeout in seconds for pool tasks
# If not set or commented out, the default value of 30 seconds will be used
# Set to a positive number to specify timeout in seconds
# Default: 30
# default_timeout = 30

[editor]
# Idle timeout in minutes for code-server sessions
# If no activity is detected within this period, code-server will shut down automatically
# Set to 0 to disable idle timeout
# Default: 60
# idle_timeout = 60

[file]
# Maximum download size in bytes for URL fetches
# Caps payloads from malicious or misbehaving servers before they fill the disk
# If not set or 0, no size limit is applied (unlimited)
# Example: 10737418240 (10 GiB)
# max_download_bytes = 0

[interface]
# Virtual interfaces to report, as a comma-separated list of interface names,
# glob patterns, or both
# Interfaces backed by hardware are always reported, and so are the virtual
# links configured on top of them: bridges, bonds, VLANs, VXLANs, teams, VRF
# masters, Open vSwitch bridges, and any kind the kernel does not name. What is
# left out is the kinds a running system creates one of per container or per
# connection: one half of a veth pair, a macvlan or ipvlan child, and a tun or
# tap device. Naming one here reports it in both the interface list and the
# traffic counters.
# Never reported, and not recoverable through this setting: loopback, and an
# interface with no hardware address such as a WireGuard, OpenVPN tun or PPP
# link, which cannot be identified without one.
# Use * to report every interface that has a hardware address and is not
# loopback, which keeps the reported interfaces of a machine as they were
# before this setting existed.
# A machine that has only interfaces of the kinds left out, such as one running
# inside a container, reports them rather than reporting none.
# On Linux the kind of a link is read from sysfs. On macOS and Windows, which
# expose none, the interface name decides instead.
# Names and patterns are matched with case.
# Default: empty (only the interfaces described above are reported)
# include_virtual = br0, veth*
