[server]
url = {{.URL}}
id = {{.ID}}
key = {{.Key}}

[ssl]
verify = {{.Verify}}
ca_cert = {{.CACert}}

[logging]
debug = {{.Debug}}

[pool]
# Maximum number of concurrent workers in the global worker pool
# Default: 20
# max_workers = 20

# Size of the job queue for the global worker pool
# Default: 200
# queue_size = 200

# Default timeout in seconds for pool tasks
# If not set or commented out, the default value of 30 seconds will be used
# Set to a positive number to specify timeout in seconds
# Default: 30
# default_timeout = 30

[editor]
# Idle timeout in minutes for code-server sessions
# If no activity is detected within this period, code-server will shut down automatically
# Set to 0 to disable idle timeout
# Default: 60
# idle_timeout = 60

[file]
# Maximum download size in bytes for URL fetches
# Caps payloads from malicious or misbehaving servers before they fill the disk
# If not set or 0, no size limit is applied (unlimited)
# Example: 10737418240 (10 GiB)
# max_download_bytes = 0

[interface]
# Virtual interfaces to report anyway, as a comma-separated list of interface
# names, glob patterns, or both
# Traffic is not reported for the interface kinds a running system creates one
# of per container or per connection: one half of a veth pair, a macvlan or
# ipvlan child, and a tun or tap device. They keep their place in the interface
# list; only their traffic samples go away. Every other kind reports traffic,
# including bridges, bonds, VLANs, VXLANs, teams, VRF masters, Open vSwitch
# bridges, and any kind the kernel does not name. Naming one here reports its
# traffic too.
# Never reported, and not recoverable through this setting: loopback, and an
# interface with no hardware address such as a WireGuard, OpenVPN tun or PPP
# link, which cannot be identified without one.
# A machine that has only interfaces of the kinds above, such as one running
# inside a container, reports traffic for them rather than for nothing.
# On Linux the kind of a link is read from sysfs. On macOS and Windows, which
# expose none, traffic covers exactly the interfaces the interface list holds.
# Names and patterns are matched with case.
# Default: empty
# include_virtual = veth0, cali*

# Leave those same kinds out of the reported interface list as well
# The interface list otherwise reports what it always has, so upgrading the
# agent never takes an interface out of it. This setting is the exception, and
# the only setting here whose safety depends on the server: turn it on only
# against a server that keeps an interface it stops being told about. A server
# that deletes such an interface deletes its traffic history with it.
# Default: false
# exclude_virtual_from_inventory = false
